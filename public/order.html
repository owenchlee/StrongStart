<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/style.css"><script src="/theme.js"></script><title>Kit Order Form</title>
</head><body class="public">
<header class="site-head simple"><div class="in"><p class="brand"><img class="logo logo-light" src="/img/strong-start-logo.png" alt="Strong Start, a children's literacy charity"><img class="logo logo-dark" src="/img/strong-start-logo-dark.png" alt="" aria-hidden="true"><span class="app">CribNotes</span></p></div></header>
<main id="main"><div class="card" id="box"><h1>Baby Connections kit order</h1><p class="muted" id="hi" role="status">Loading…</p>
<form id="f" hidden novalidate>
<p class="hint-note" id="hintnote" hidden>We filled in a few details from your email. Please check them and fix anything that's off.</p>
<label>Your name<input name="facilitator_name" maxlength="120" autocomplete="name" required></label>
<h2>Your program</h2>
<label>Program name<input name="pname" maxlength="200" required></label>
<div class="row">
  <label>Delivery format <span class="muted">(optional)</span>
    <select name="delivery_format">
      <option value="in_person">In-Person</option>
      <option value="virtual">Virtual</option>
      <option value="hybrid">Hybrid</option>
    </select>
  </label>
  <label>Community served <span class="muted">(optional)</span><input name="community_served" maxlength="200" placeholder="e.g. Waterloo, Cambridge"></label>
</div>
<label>Location <span class="muted">(optional)</span><input name="location" maxlength="200"></label>
<label>Session schedule <span class="muted">(optional)</span><input name="session_schedule" maxlength="200" placeholder="e.g. Tuesdays 10:00 - 11:30 AM (6 weeks)"></label>
<div class="row"><label>Start date <span class="muted">(optional)</span><input type="date" name="start_date"></label><label>End date <span class="muted">(optional)</span><input type="date" name="end_date"></label></div>
<label>Projected number of participants <span class="muted">(optional)</span><input type="number" inputmode="numeric" min="1" max="100000" name="projected" id="proj"></label>
<h2>Kits needed</h2><div id="items" role="group" aria-label="Kits needed"></div>
<p class="muted" id="rec" aria-live="polite"></p>
<h2>Delivery</h2>
<label>Shipping address<textarea name="shipping_address" rows="3" maxlength="500" autocomplete="street-address" required></textarea></label>
<label>Requested delivery date <span class="muted">(optional)</span><input type="date" name="requested_date"></label>
<label>Notes <span class="muted">(optional)</span><textarea name="notes" rows="2" maxlength="2000"></textarea></label>
<p class="err" id="err" role="alert"></p><button id="go">Submit order</button></form></div></main>
<script>
const token = location.pathname.split('/').pop();
const $ = (s) => document.querySelector(s);
const f = $('#f');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const qtyInputs = () => [...document.querySelectorAll('[data-item]')];
const setItem = (k, v) => { const e = document.querySelector(`[data-item="${CSS.escape(k)}"]`); if (e) e.value = v; };

fetch('/api/order-form/' + encodeURIComponent(token)).then(async (r) => {
  const d = await r.json().catch(() => ({}));
  if (!r.ok) return ($('#hi').textContent = d.error || 'We could not load this order form.');
  if (d.status !== 'form_sent') return ($('#hi').textContent = 'This order has already been submitted. Thank you!');
  $('#hi').textContent = 'Ordering as ' + (d.name || d.email);
  if (d.name) f.facilitator_name.value = d.name;
  $('#items').innerHTML = d.kitItems.map((k) => `<div class="kit-row"><label for="q-${esc(k).replace(/\W/g, '')}">${esc(k)}</label>
    <div class="stepper"><button type="button" data-step="-1" aria-label="Fewer ${esc(k)}">&minus;</button>
    <input id="q-${esc(k).replace(/\W/g, '')}" type="number" inputmode="numeric" min="0" max="5000" value="0" data-item="${esc(k)}">
    <button type="button" data-step="1" aria-label="More ${esc(k)}">+</button></div></div>`).join('');
  const h = d.hints || {};
  let used = false;
  const fill = (el, v) => { if (v != null && v !== '' && el) { el.value = v; used = true; } };
  fill(f.pname, h.program_name);
  fill(f.start_date, h.start_date);
  fill(f.end_date, h.end_date);
  fill(f.shipping_address, h.address);
  if (h.participants) { fill(f.projected, h.participants); suggest(); }
  if (h.kits) { setItem('Participant Kits', h.kits); used = true; }
  $('#hintnote').hidden = !used;
  f.hidden = false;
  f.facilitator_name.focus();
}).catch(() => ($('#hi').textContent = 'We could not load this order form. Please check your connection and reload.'));

$('#items').addEventListener('click', (e) => {
  const b = e.target.closest('[data-step]');
  if (!b) return;
  const i = b.parentElement.querySelector('input');
  i.value = Math.min(5000, Math.max(0, (parseInt(i.value, 10) || 0) + Number(b.dataset.step)));
});

function suggest() {
  const n = +$('#proj').value;
  $('#rec').textContent = n ? `Suggestion: ${n} participant kits, 1 facilitator kit and 1 manual.` : '';
  if (n) { const set = (k, v) => { const e = document.querySelector(`[data-item="${CSS.escape(k)}"]`); if (e && +e.value === 0) e.value = v; }; set('Participant Kits', n); set('Facilitator Kits', 1); set('Facilitator Manuals', 1); }
}
$('#proj').oninput = suggest;

function validate() {
  document.querySelectorAll('.field-err').forEach((e) => e.remove());
  f.querySelectorAll('[aria-invalid]').forEach((e) => e.removeAttribute('aria-invalid'));
  const bad = [];
  const need = (el, msg) => { if (!el.value.trim()) bad.push([el, msg]); };
  need(f.facilitator_name, 'Please enter your name.');
  need(f.pname, 'Please enter your program name.');
  need(f.shipping_address, 'Please enter the address we should ship to.');
  if (!qtyInputs().some((i) => (parseInt(i.value, 10) || 0) > 0)) bad.push([qtyInputs()[0], 'Please choose at least one kit.']);
  if (f.start_date.value && f.end_date.value && f.end_date.value < f.start_date.value) bad.push([f.end_date, 'The end date must be after the start date.']);
  for (const [el, msg] of bad) {
    el.setAttribute('aria-invalid', 'true');
    const p = document.createElement('p'); p.className = 'field-err'; p.textContent = msg;
    (el.closest('label') || el.closest('.kit-row') || el.parentElement).after(p);
  }
  if (bad.length) { bad[0][0].focus(); $('#err').textContent = 'Please fix the highlighted fields.'; }
  return !bad.length;
}

f.onsubmit = async (e) => {
  e.preventDefault(); $('#err').textContent = '';
  if (!validate()) return;
  const go = $('#go'); go.disabled = true; go.textContent = 'Submitting…';
  const body = {
    facilitator_name: f.facilitator_name.value,
    program: {
      name: f.pname.value,
      location: f.location.value,
      start_date: f.start_date.value,
      end_date: f.end_date.value,
      projected_participants: f.projected.value,
      delivery_format: f.delivery_format ? f.delivery_format.value : 'in_person',
      session_schedule: f.session_schedule ? f.session_schedule.value : '',
      community_served: f.community_served ? f.community_served.value : ''
    },
    items: qtyInputs().map((i) => ({ item: i.dataset.item, qty: i.value })),
    shipping_address: f.shipping_address.value, requested_date: f.requested_date.value, notes: f.notes.value,
  };
  try {
    const r = await fetch('/api/order-form/' + encodeURIComponent(token), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Something went wrong. Please try again.');
    const summary = body.items.filter((i) => +i.qty > 0).map((i) => `<li>${esc(i.item)}: ${esc(i.qty)}</li>`).join('');
    $('#box').innerHTML = `<div class="done-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h1>Order received</h1><p>Thank you! A confirmation email is on its way, and we'll email you again when your kits ship.</p>
      <h2>${esc(body.program.name)}</h2><ul class="order-summary">${summary}</ul><p><strong>Shipping to:</strong><br>${esc(body.shipping_address).replace(/\n/g, '<br>')}</p>`;
    $('#box').querySelector('h1').setAttribute('tabindex', '-1'); $('#box').querySelector('h1').focus();
  } catch (err) {
    $('#err').textContent = err.message === 'Failed to fetch' ? 'Network problem. Please check your connection and try again.' : err.message;
    go.disabled = false; go.textContent = 'Submit order';
  }
};
</script><script src="/dictate.js" defer></script>
</body></html>
