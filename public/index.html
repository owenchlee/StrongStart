<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/style.css"><script src="/theme.js"></script><title>Baby Connections Dashboard</title></head><body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-head"><div class="in"><h1 class="brand"><img class="logo logo-light" src="/img/strong-start-logo.png" alt="Strong Start, a children's literacy charity"><img class="logo logo-dark" src="/img/strong-start-logo-dark.png" alt="" aria-hidden="true"><span class="app">Baby Connections<small>Staff</small></span></h1>
<nav aria-label="Dashboard sections"><button data-t="partners">Partners</button><button data-t="orders" class="on">Orders</button><button data-t="programs">Programs &amp; feedback</button><button data-t="outstanding">Outstanding surveys</button><button data-t="review">Review queue</button><button data-t="trends">Trends</button><button data-t="rollup">Rollup</button><button data-t="emails">Emails</button><button data-t="staff" id="staffTab" hidden>Staff</button><a href="/compose.html">Compose email</a></nav>
<div class="who"><button type="button" class="sec sm profile" id="profileBtn" aria-haspopup="true" aria-expanded="false" aria-controls="profileMenu"><span class="avatar" id="av" aria-hidden="true"></span><span id="who"></span><svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button><div class="menu-pop" id="profileMenu" hidden><p class="menu-h">Preferences</p><fieldset><legend>Appearance</legend><label class="opt"><input type="radio" name="theme" value="system"> System</label><label class="opt"><input type="radio" name="theme" value="light"> Light</label><label class="opt"><input type="radio" name="theme" value="dark"> Dark</label></fieldset><button type="button" class="sec sm" id="signout" onclick="logout()">Sign out</button></div></div></div></header>
<main class="wide" id="main" tabindex="-1">
<h2 class="page-title" id="pageTitle">Orders</h2>
<div class="stats" id="stats" role="group" aria-label="Program overview"></div>
<section id="partners" hidden></section><section id="orders"></section><section id="programs" hidden></section><section id="outstanding" hidden></section><section id="review" hidden></section><section id="trends" hidden></section><section id="rollup" hidden></section><section id="emails" hidden></section><section id="staff" hidden></section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const j = (u, o) => fetch(u, o).then(async (r) => {
  if (r.status === 401) { location.href = '/login.html'; throw new Error('signed out'); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok && !body.error) body.error = 'Request failed (' + r.status + ')';
  return body;
});
const jsonPost = (u, b, method = 'POST') => j(u, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b || {}) });
let me = null;
fetch('/api/me').then((r) => r.json()).then((m) => {
  if (!m.staff) { location.href = '/login.html'; return; }
  me = m.staff; $('#who').textContent = m.staff.name || m.staff.email; $('#av').textContent = ($('#who').textContent.trim()[0] || '?').toUpperCase();
  if (m.authDisabled) $('#signout').hidden = true; // no sign-out while login is off
  $('#staffTab').hidden = m.staff.role !== 'admin';
});
async function logout() { await fetch('/auth/logout', { method: 'POST' }); location.href = '/login.html'; }
const date = (s) => (s ? String(s).slice(0, 10) : '–');
const num = (n, d = 2) => (n == null ? '–' : +Number(n).toFixed(d));
const enc = encodeURIComponent;
const TABS = ['partners', 'orders', 'programs', 'outstanding', 'review', 'trends', 'rollup', 'emails', 'staff'];
let tab = 'orders';
document.querySelectorAll('nav button').forEach((b) => (b.onclick = () => { tab = b.dataset.t; refresh(); }));

// Presentation only: label cells so tables can stack into readable rows on narrow screens.
function enhanceTables() {
  document.querySelectorAll('.tbl > table').forEach((t) => {
    const rows = [...t.rows], head = rows[0];
    const simple = head && [...head.cells].every((c) => c.tagName === 'TH') && rows.slice(1).every((r) => [...r.cells].every((c) => c.tagName === 'TD'));
    if (!simple) { t.parentElement.tabIndex = 0; t.parentElement.setAttribute('role', 'region'); t.parentElement.setAttribute('aria-label', (t.querySelector('caption') || {}).textContent || 'Table'); return; }
    const names = [...head.cells].map((c) => (c.textContent.trim() === '#' ? 'Order' : c.textContent.trim()));
    head.classList.add('hd'); t.classList.add('stack');
    rows.slice(1).forEach((r) => { let i = 0; [...r.cells].forEach((c) => { if (names[i] && c.colSpan === 1) c.dataset.label = names[i]; i += c.colSpan || 1; }); });
  });
}
async function refresh() {
  document.querySelectorAll('nav button').forEach((b) => { const on = b.dataset.t === tab; b.classList.toggle('on', on); if (on) { b.setAttribute('aria-current', 'page'); b.scrollIntoView({ block: 'nearest', inline: 'center' }); $('#pageTitle').textContent = b.textContent; } else b.removeAttribute('aria-current'); });
  TABS.forEach((t) => ($('#' + t).hidden = t !== tab));
  const o = await j('/api/overview');
  $('#stats').innerHTML = [
    ['Partners', o.partners || 0],
    ['Active partners', o.activePartners || 0],
    ['Facilitators', o.facilitators],
    ['Open orders', o.openOrders],
    ['Programs', o.programs],
    ['Completed programs', o.completedPrograms || 0],
    ['Feedback responses', o.feedbackResponses],
    ['Needs review', o.needsReview]
  ]
    .map(([l, n]) => `<div class="stat${l === 'Needs review' && Number(n) > 0 ? ' attn' : ''}"><b>${esc(n)}</b><span class="muted">${l}</span></div>`).join('')
    + `<div class="stat"><b>${o.aiEnabled ? 'On' : 'Off'}</b><span class="muted">AI handwriting</span></div>`;
  await { partners: renderPartners, orders, programs, outstanding, review, trends, rollup, emails, staff }[tab]();
  enhanceTables();
}

// ---- Partners (Phase 1) ----
let partnerFilterStage = '';
const STAGE_LABELS = {
  expression_of_interest: 'Expression of Interest',
  initial_contact: 'Initial Contact',
  discovery: 'Discovery',
  pdsa_review: 'PDSA Review',
  pdsa_signed: 'PDSA Signed',
  active: 'Active Partner',
  inactive: 'Inactive'
};

async function renderPartners() {
  const [pipeline, partnerList] = await Promise.all([
    j('/api/partners/pipeline'),
    j('/api/partners' + (partnerFilterStage ? '?stage=' + enc(partnerFilterStage) : ''))
  ]);
  const stages = pipeline.stages || Object.keys(STAGE_LABELS);

  $('#partners').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s3)">
      <div style="display:flex;gap:var(--s2);flex-wrap:wrap">
        <a class="btn sec sm" href="/partner-interest.html" target="_blank" rel="noopener">Open Public EOI Form</a>
        <button class="sm sec" id="copyEoiBtn" onclick="navigator.clipboard.writeText(location.origin + '/partner-interest.html').then(() => alert('Public EOI link copied to clipboard!'))">Copy EOI Link</button>
      </div>
      <button class="sm" onclick="$('#addPartnerDetails').open = true; $('#addPartnerDetails').scrollIntoView({behavior:'smooth'})">+ New Partner</button>
    </div>

    <div class="stats" style="margin-bottom:var(--s4);grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">
      ${stages.map((st) => `
        <div class="stat${partnerFilterStage === st ? ' attn' : ''}" style="cursor:pointer" onclick="setPartnerFilter('${st}')">
          <b>${pipeline.counts[st] || 0}</b>
          <span class="muted">${STAGE_LABELS[st] || st}</span>
        </div>
      `).join('')}
      <div class="stat${!partnerFilterStage ? ' attn' : ''}" style="cursor:pointer" onclick="setPartnerFilter('')">
        <b>${pipeline.total || 0}</b>
        <span class="muted">All Partners</span>
      </div>
    </div>

    <details class="card wide-card" id="addPartnerDetails" style="margin-bottom:var(--s4)">
      <summary><b>Add Partner Organization</b></summary>
      <form id="newPartnerForm" style="margin-top:var(--s3)">
        <div class="row">
          <label>Organization Name *<input id="npName" required maxlength="200" placeholder="e.g. Cambridge Community Health"></label>
          <label>Stage
            <select id="npStage">
              ${stages.map((s) => `<option value="${s}">${STAGE_LABELS[s] || s}</option>`).join('')}
            </select>
          </label>
        </div>
        <div class="row">
          <label>Contact Name<input id="npContact" maxlength="120"></label>
          <label>Contact Email<input id="npEmail" type="email" maxlength="254"></label>
          <label>Contact Phone<input id="npPhone" maxlength="50"></label>
        </div>
        <label>Communities Served<input id="npCommunities" maxlength="500" placeholder="e.g. Cambridge, North Dumfries"></label>
        <label>Notes / Context<textarea id="npNotes" rows="2" maxlength="5000"></textarea></label>
        <p><button type="submit" class="sm">Save Partner</button> <span id="npMsg" class="err"></span></p>
      </form>
    </details>

    <div class="tbl">
      <table>
        <tr>
          <th>Organization</th>
          <th>Contact</th>
          <th>Communities</th>
          <th>Stage</th>
          <th>PDSA Agreement</th>
          <th>Facilitators &amp; Programs</th>
          <th>Actions</th>
        </tr>
        ${(partnerList || []).map((p) => `
          <tr>
            <td><b>${esc(p.name)}</b></td>
            <td>${esc(p.contact_name || '')}<br><span class="muted">${esc(p.contact_email || p.contact_phone || '–')}</span></td>
            <td>${esc(p.communities_served || '–')}</td>
            <td>
              <select onchange="updatePartnerStage(${p.id}, this.value)" style="min-height:32px;padding:2px 6px;font-size:var(--fs-sm)">
                ${stages.map((st) => `<option value="${st}" ${st === p.stage ? 'selected' : ''}>${STAGE_LABELS[st] || st}</option>`).join('')}
              </select>
            </td>
            <td>
              <span class="pill ${p.pdsa_status === 'executed' || p.stage === 'active' ? 'st-on' : 'st-off'}">${esc(p.pdsa_status || 'pending')}</span>
              ${p.pdsa_expiry_date ? `<br><small class="muted">Expires ${date(p.pdsa_expiry_date)}</small>` : ''}
            </td>
            <td class="muted">${p.facilitator_count || 0} facilitators<br>${p.program_count || 0} programs</td>
            <td>
              <button class="sm sec" onclick="viewPartner(${p.id})">Details</button>
            </td>
          </tr>
        `).join('') || '<tr><td colspan="7" class="muted">No partners found.</td></tr>'}
      </table>
    </div>
    <div id="partnerDetailBox"></div>
  `;

  $('#newPartnerForm').onsubmit = async (e) => {
    e.preventDefault();
    const name = $('#npName').value.trim();
    if (!name) return ($('#npMsg').textContent = 'Organization name is required');
    const r = await jsonPost('/api/partners', {
      name,
      stage: $('#npStage').value,
      contact_name: $('#npContact').value.trim(),
      contact_email: $('#npEmail').value.trim(),
      contact_phone: $('#npPhone').value.trim(),
      communities_served: $('#npCommunities').value.trim(),
      notes: $('#npNotes').value.trim()
    });
    if (r.error) $('#npMsg').textContent = r.error;
    else refresh();
  };
}

function setPartnerFilter(st) {
  partnerFilterStage = st;
  refresh();
}

async function updatePartnerStage(id, stage) {
  await j(`/api/partners/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ stage })
  });
  refresh();
}

async function viewPartner(id) {
  const [p, docs, msgs] = await Promise.all([
    j(`/api/partners/${id}`),
    j(`/api/partners/${id}/documents`).catch(() => []),
    j(`/api/partners/${id}/messages`).catch(() => [])
  ]);
  if (p.error) return alert(p.error);

  $('#partnerDetailBox').innerHTML = `
    <div class="card wide-card" style="margin-top:var(--s4);border:2px solid var(--primary)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <h3 style="margin:0 0 var(--s1)">${esc(p.name)}</h3>
          <p class="muted" style="margin:0"><b>Communities:</b> ${esc(p.communities_served || 'Not specified')}</p>
        </div>
        <button class="sm sec" onclick="$('#partnerDetailBox').innerHTML = ''">Close</button>
      </div>

      <div class="row" style="margin-top:var(--s3)">
        <div><b>Contact:</b> ${esc(p.contact_name || '–')} &bull; <a href="mailto:${esc(p.contact_email)}">${esc(p.contact_email || '–')}</a> &bull; ${esc(p.contact_phone || '–')}</div>
        <div><b>Current Stage:</b> <span class="pill st-ordered">${esc(p.stage)}</span></div>
      </div>

      <!-- PDSA Agreement Section -->
      <div style="margin-top:var(--s3);background:var(--surface-2);padding:var(--s3);border-radius:var(--r-md)">
        <h4 style="margin:0 0 var(--s2)">Program Delivery &amp; Support Agreement (PDSA)</h4>
        <div class="row">
          <label>Status
            <select id="pdetPdsaStatus">
              <option value="pending" ${p.pdsa_status === 'pending' ? 'selected' : ''}>Pending</option>
              <option value="issued" ${p.pdsa_status === 'issued' ? 'selected' : ''}>Issued</option>
              <option value="signed" ${p.pdsa_status === 'signed' ? 'selected' : ''}>Signed</option>
              <option value="executed" ${p.pdsa_status === 'executed' ? 'selected' : ''}>Executed</option>
              <option value="expired" ${p.pdsa_status === 'expired' ? 'selected' : ''}>Expired</option>
            </select>
          </label>
          <label>Date Issued<input type="date" id="pdetIssued" value="${date(p.pdsa_issued_date)}"></label>
          <label>Date Executed<input type="date" id="pdetExecuted" value="${date(p.pdsa_executed_date)}"></label>
          <label>Expiry Date<input type="date" id="pdetExpiry" value="${date(p.pdsa_expiry_date)}"></label>
        </div>
      </div>

      <div style="margin-top:var(--s3)">
        <label>Relationship Notes / Follow-ups
          <textarea id="pdetNotes" rows="2">${esc(p.notes || '')}</textarea>
        </label>
        <p><button class="sm" onclick="savePartnerDetails(${p.id})">Save Agreement &amp; Notes</button></p>
      </div>

      <!-- Uploaded Documents & Agreements -->
      <div style="margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--s2)">
          <h4 style="margin:0">Partner Documents &amp; Agreements (${docs.length})</h4>
          <div>
            <input type="file" id="pUploadInput" multiple style="display:none" onchange="uploadPartnerDocs(${p.id})">
            <button class="sm" onclick="$('#pUploadInput').click()">+ Upload Document (PDF / Agreement)</button>
          </div>
        </div>
        <div class="tbl" style="margin-top:var(--s2)">
          <table>
            <tr><th>Document Name</th><th>Uploaded By</th><th>Date</th><th>Size</th><th>Actions</th></tr>
            ${docs.map((d) => `
              <tr>
                <td><b>${esc(d.original_name)}</b></td>
                <td><span class="pill st-off">${esc(d.uploaded_by)}</span></td>
                <td class="muted">${date(d.created_at)}</td>
                <td class="muted">${d.file_size ? Math.round(d.file_size / 1024) + ' KB' : '–'}</td>
                <td>
                  <a class="btn sm sec" href="/api/partners/${p.id}/documents/${d.id}/download" target="_blank" rel="noopener">Download</a>
                  <button class="sm sec" onclick="deletePartnerDoc(${p.id}, ${d.id})" style="color:var(--err);margin-left:4px">Delete</button>
                </td>
              </tr>
            `).join('') || '<tr><td colspan="5" class="muted">No documents uploaded yet. Upload PDSA agreements, onboarding packs, or certificates here.</td></tr>'}
          </table>
        </div>
      </div>

      <!-- Two-Way CRM Conversation Timeline -->
      <div style="margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line)">
        <h4 style="margin:0 0 var(--s2)">Conversation History &amp; Replies (${msgs.length})</h4>
        <div style="display:flex;flex-direction:column;gap:var(--s3);max-height:350px;overflow-y:auto;padding-right:var(--s2)">
          ${msgs.map((m) => `
            <div class="card" style="margin:0;border-left:4px solid ${m.direction === 'inbound' ? 'var(--ok)' : 'var(--primary)'};background:var(--surface-2)">
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-sm)">
                <b>${m.direction === 'inbound' ? `<span style="color:var(--ok)">&larr; Inbound Email from ${esc(m.from_email)}</span>` : `<span style="color:var(--primary)">&rarr; Staff Sent to ${esc(m.to_email)}</span>`}</b>
                <span class="muted">${date(m.created_at)} ${String(m.created_at).slice(11, 16)}</span>
              </div>
              <div style="margin-top:var(--s1);font-weight:600">${esc(m.subject || 'No Subject')}</div>
              <div style="margin-top:var(--s1);white-space:pre-wrap;font-size:var(--fs-sm);line-height:1.5">${esc(m.body)}</div>
              ${Array.isArray(m.attachments) && m.attachments.length ? `
                <div style="margin-top:var(--s2);display:flex;gap:var(--s2);flex-wrap:wrap">
                  ${m.attachments.map((at) => `<a class="pill st-on" href="${esc(at.url)}" target="_blank" rel="noopener" style="text-decoration:none">&bull; ${esc(at.name)}</a>`).join('')}
                </div>
              ` : ''}
            </div>
          `).join('') || '<p class="muted">No messages yet. Send an email below or receive replies from the partner.</p>'}
        </div>

        <!-- CRM Reply Box -->
        <div style="margin-top:var(--s4);background:var(--surface);border:1px solid var(--primary);border-radius:var(--r-md);padding:var(--s3)">
          <h4 style="margin:0 0 var(--s2);color:var(--primary-text)">Reply to Partner / Facilitator</h4>
          <label>Subject
            <input id="crmReplySubject" value="Re: Baby Connections Partnership - ${esc(p.name)}">
          </label>
          <label>Message
            <textarea id="crmReplyBody" rows="4" placeholder="Type your message to ${esc(p.contact_name || p.contact_email)}…"></textarea>
          </label>

          ${docs.length ? `
            <div style="margin-top:var(--s2)">
              <small><b>Attach Uploaded Documents:</b></small>
              <div style="display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s1)">
                ${docs.map((d) => `
                  <label style="display:inline-flex;align-items:center;gap:4px;margin:0;font-weight:normal;font-size:var(--fs-sm);cursor:pointer">
                    <input type="checkbox" class="crmDocCheckbox" value="${d.id}" checked>
                    ${esc(d.original_name)}
                  </label>
                `).join('')}
              </div>
            </div>
          ` : '<p class="muted" style="font-size:var(--fs-sm);margin:var(--s1) 0">No documents uploaded yet to attach.</p>'}

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:var(--s3);flex-wrap:wrap;gap:var(--s2)">
            <label style="margin:0;display:flex;align-items:center;gap:var(--s2);font-weight:normal">
              <span>Advance stage to:</span>
              <select id="crmReplyStage" style="min-height:32px;padding:2px 6px">
                <option value="">Keep current (${esc(p.stage)})</option>
                <option value="initial_contact">Initial Contact</option>
                <option value="discovery">Discovery</option>
                <option value="pdsa_review">PDSA Review</option>
                <option value="pdsa_signed">PDSA Signed</option>
                <option value="active">Active Partner</option>
              </select>
            </label>
            <button class="sm" id="crmSendBtn" onclick="sendPartnerReply(${p.id})">Send Email &amp; Documents</button>
          </div>
          <p id="crmReplyMsg" style="margin:var(--s2) 0 0" class="muted"></p>
        </div>
      </div>

      <!-- Linked Facilitators & Programs -->
      <h4 style="margin-top:var(--s5)">Linked Facilitators (${(p.facilitators || []).length})</h4>
      ${(p.facilitators || []).map((f) => `<div>&bull; <b>${esc(f.name || f.email)}</b> (${esc(f.email)})</div>`).join('') || '<p class="muted">No facilitators linked yet.</p>'}
      <div style="margin-top:var(--s2);display:flex;gap:var(--s2);align-items:flex-end">
        <label style="margin:0;flex:1">Link facilitator by email
          <input id="linkFacEmail" type="email" placeholder="facilitator@example.org">
        </label>
        <button class="sm sec" onclick="linkFacToPartner(${p.id})">Link Facilitator</button>
      </div>

      <h4 style="margin-top:var(--s4)">Programs (${(p.programs || []).length})</h4>
      ${(p.programs || []).map((pr) => `<div>&bull; <b>${esc(pr.name)}</b> &bull; ${date(pr.start_date)} &rarr; ${date(pr.end_date)} &bull; ${pr.feedback_count || 0} feedback responses</div>`).join('') || '<p class="muted">No programs delivered under this partner yet.</p>'}
    </div>
  `;
  $('#partnerDetailBox').scrollIntoView({ behavior: 'smooth' });
}

async function uploadPartnerDocs(partnerId) {
  const input = $('#pUploadInput');
  if (!input.files || !input.files.length) return;
  const formData = new FormData();
  for (const f of input.files) formData.append('files', f);

  const res = await fetch(`/api/partners/${partnerId}/documents`, {
    method: 'POST',
    body: formData
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) alert(data.error || 'Upload failed');
  else viewPartner(partnerId);
}

async function deletePartnerDoc(partnerId, docId) {
  if (!confirm('Are you sure you want to remove this document?')) return;
  await j(`/api/partners/${partnerId}/documents/${docId}`, { method: 'DELETE' });
  viewPartner(partnerId);
}

async function sendPartnerReply(partnerId) {
  const subject = $('#crmReplySubject').value.trim();
  const body = $('#crmReplyBody').value.trim();
  const stage = $('#crmReplyStage').value;
  const msgEl = $('#crmReplyMsg');
  const btn = $('#crmSendBtn');

  if (!body) return alert('Please enter a message body');

  const selectedDocs = [...document.querySelectorAll('.crmDocCheckbox:checked')].map((c) => Number(c.value));

  btn.disabled = true;
  btn.textContent = 'Sending…';
  msgEl.textContent = '';

  try {
    const res = await jsonPost(`/api/partners/${partnerId}/reply`, {
      subject,
      body,
      stage: stage || undefined,
      document_ids: selectedDocs
    });

    if (res.error) throw new Error(res.error);

    alert('Email sent successfully with attached documents!');
    viewPartner(partnerId);
    refresh();
  } catch (err) {
    alert(err.message || 'Failed to send reply');
    btn.disabled = false;
    btn.textContent = 'Send Email & Documents';
  }
}

async function savePartnerDetails(id) {
  await j(`/api/partners/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      pdsa_status: $('#pdetPdsaStatus').value,

// ---- Trends (dependency-free SVG) ----
function chart(title, desc, pts, { kind = 'line', yMax, unit = '', raw = false } = {}) {
  // pts: [{label, value}]
  const id = 'c' + Math.random().toString(36).slice(2, 8);
  if (!pts.length) return `<div class="chart"><h2>${esc(title)}</h2><p class="muted">No data yet.</p></div>`;
  const W = Math.max(300, Math.min(760, ($('#main').clientWidth || 640) - 66)), H = 230, L = 36, R = 12, T = 12, B = 30;
  const top = yMax || Math.max(1, ...pts.map((p) => p.value)) * 1.1;
  const x = (i) => L + (pts.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (pts.length - 1));
  const y = (v) => T + (H - T - B) * (1 - v / top);
  const ticks = [0, 0.5, 1].map((f) => f * top);
  const step = Math.max(1, Math.ceil(pts.length / 6));
  let marks;
  if (kind === 'bar') {
    const bw = Math.min(56, Math.max(4, ((W - L - R) / pts.length) * 0.7));
    marks = pts.map((p, i) => { const cx = L + ((i + 0.5) * (W - L - R)) / pts.length; return `<rect class="bar-rect" x="${cx - bw / 2}" y="${y(p.value)}" width="${bw}" height="${Math.max(0, H - B - y(p.value))}"><title>${esc(p.label)}: ${esc(num(p.value))}${unit}</title></rect>`; }).join('');
  } else {
    marks = `<polyline class="ln" points="${pts.map((p, i) => `${x(i)},${y(p.value)}`).join(' ')}"/>` + pts.map((p, i) => `<circle class="dot" cx="${x(i)}" cy="${y(p.value)}" r="4"><title>${esc(p.label)}: ${esc(num(p.value))}${unit}</title></circle>`).join('');
  }
  const xl = pts.map((p, i) => (i % step === 0 ? `<text x="${kind === 'bar' ? L + ((i + 0.5) * (W - L - R)) / pts.length : x(i)}" y="${H - 10}" text-anchor="middle">${esc(raw ? p.label : String(p.label).slice(5))}</text>` : '')).join('');
  return `<div class="chart"><h2 id="${id}h">${esc(title)}</h2>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${id}h ${id}d"><desc id="${id}d">${esc(desc)}</desc>
   <line class="axis" x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}"/><line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${H - B}"/>
   ${ticks.filter((t) => t > 0).map((t) => `<line class="grid" x1="${L}" y1="${y(t)}" x2="${W - R}" y2="${y(t)}"/>`).join('')}${ticks.map((t) => `<text x="${L - 4}" y="${y(t) + 4}" text-anchor="end">${esc(num(t, 1))}</text>`).join('')}${xl}${marks}</svg>
  <details><summary class="muted">Show data table</summary><div class="tbl"><table><tr><th>Date</th><th>Value</th></tr>${pts.map((p) => `<tr><td>${esc(p.label)}</td><td>${esc(num(p.value))}${unit}</td></tr>`).join('')}</table></div></details></div>`;
}

  const t = await j('/api/trends');
  if (t.error) { $('#trends').innerHTML = `<p class="err">${esc(t.error)}</p>`; return; }
  const total = t.responsesPerDay.reduce((s, d) => s + d.responses, 0);
  $('#trends').innerHTML = `<p class="muted">Last ${esc(t.days)} days.</p>
  <div class="stats"><div class="stat"><b>${esc(total)}</b><span class="muted">responses</span></div>
   <div class="stat"><b>${t.orderToDelivery.avgDays == null ? '–' : esc(t.orderToDelivery.avgDays) + ' d'}</b><span class="muted">avg order to delivery</span></div></div>`
    + chart('Responses per day', `Bar chart of feedback responses per day, ${total} in total.`, t.responsesPerDay.map((d) => ({ label: d.day, value: d.responses })), { kind: 'bar' })
    + chart('Average rating per day', 'Line chart of the average parent rating per day, out of 5.', t.avgRatingPerDay.map((d) => ({ label: d.day, value: d.avg_rating })), { yMax: 5 })

    + `<div class="tbl"><table><caption class="sr-only">Orders by status</caption><tr><th>Status</th><th>Orders</th></tr>${t.ordersByStatus.map((d) => `<tr><td><span class="pill st-${esc(d.status)}">${esc(String(d.status).replace('_', ' '))}</span></td><td>${esc(d.orders)}</td></tr>`).join('')}</table></div>`;
