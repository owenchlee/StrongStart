<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/style.css"><script src="/theme.js"></script><title>Staff sign in · Baby Connections</title></head><body class="auth">
<header class="site-head simple"><div class="in"><p class="brand"><img class="logo logo-light" src="/img/strong-start-logo.png" alt="Strong Start, a children's literacy charity"><img class="logo logo-dark" src="/img/strong-start-logo-dark.png" alt="" aria-hidden="true"><span class="app">Baby Connections</span></p></div></header>
<main id="main"><div class="card">
<h1>Staff sign in</h1>
<p class="muted">Sign in with the email address the Strong Start team added you with.</p>
<p id="msg" class="err" role="alert" hidden></p>
<a id="google" class="btn" href="/auth/google" hidden>Sign in with Google</a>
<form id="dev" hidden>
  <p class="notice warn">Development login (AUTH_DEV_LOGIN=1): no password. Never enable in production.</p>
  <label for="email">Staff email</label><input id="email" type="email" required autocomplete="email">
  <p><button>Sign in</button></p>
</form>
<p id="none" class="muted" hidden>Sign-in isn't configured yet. Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET (see .env.example).</p>
</div></main>
<script>
const $ = (s) => document.querySelector(s);
const errors = {
  not_staff: "That Google account isn't on the staff list. Ask a Strong Start admin to add your email.",
  oauth_failed: 'Sign-in failed or expired. Please try again.',
  not_configured: 'Google sign-in is not configured on this server.',
};
const e = new URLSearchParams(location.search).get('error');
if (e) { $('#msg').textContent = errors[e] || 'Sign-in failed.'; $('#msg').hidden = false; }
fetch('/api/me').then((r) => r.json()).then((me) => {
  if (me.staff) return (location.href = '/');
  $('#google').hidden = !me.google; $('#dev').hidden = !me.devLogin; $('#none').hidden = me.google || me.devLogin;
});
$('#dev').onsubmit = async (ev) => {
  ev.preventDefault();
  const r = await fetch('/auth/dev-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('#email').value }) });
  if (r.ok) return (location.href = '/');
  $('#msg').textContent = errors.not_staff; $('#msg').hidden = false;
};
</script></body></html>
